<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>存储暂时断开</title><style>body{background:#f4f1e8;color:#142924;font:18px/1.9 'PingFang SC','Microsoft YaHei',sans-serif;max-width:650px;margin:12vh auto;padding:30px}h1{font-family:'Songti SC',serif;font-weight:500}code{background:#e7f094;padding:6px}a{color:#1c6045}</style><h1>网页还在，存储暂时断开了。</h1><p>这次返回 HTTP 503。它表示目前无法读写便签，不表示便签已经被删除。</p><p>如果正在按手册练习，请在项目目录执行：</p><p><code>docker compose -p repogo-compose-lab up -d --wait</code></p><p>等存储恢复后，<a href="/">重新打开便签页 →</a></p></html>
